name: Tests
on:
  push:
    branches: [main, feat/unified-signaling-2g-5g]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python -m hetnet run --duration 8 --subscribers 4 --seed 4 --output results
      - name: Ten-seed synthetic research experiment
        if: matrix.python-version == '3.12'
        run: python -m hetnet experiment --duration 18 --subscribers 8 --start-seed 42 --runs 10 --output results/experiment
      - name: Archive reproducible experiment
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: hetnet-stage2-multiseed
          path: results/experiment/
          if-no-files-found: error
      - name: Stage 3 calibrated episode evaluation
        if: matrix.python-version == '3.12'
        run: |
          python -m hetnet calibrate --input examples/synthetic_aggregate_counts.json --output results/stage3/traffic_profile.json
          python -m hetnet validate --duration 18 --subscribers 8 --train-start-seed 21 --train-runs 5 --test-start-seed 42 --test-runs 10 --traffic-profile results/stage3/traffic_profile.json --output results/stage3
          python -m hetnet wirecheck --protocol diameter --hex 010000148000013e010000230000000100000002
          python -m hetnet stress --duration 18 --subscribers 8 --test-runs 3 --scales 1,8,20 --loss-rates 0,0.1 --traffic-profile results/stage3/traffic_profile.json --output results/stage3
      - name: Archive stage 3 validation
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: hetnet-stage3-episode-validation
          path: results/stage3/
          if-no-files-found: error
      - name: Stage 4 independent node evidence benchmark
        if: matrix.python-version == '3.12'
        run: |
          python -m hetnet run --duration 18 --subscribers 8 --no-attacks --node-case report --output results/stage4/report-demo
          python -m hetnet node-study --duration 18 --subscribers 8 --runs 6 --loss-rates 0,0.1,0.35 --output results/stage4/node-study
      - name: Archive stage 4 evidence and measurements
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: hetnet-stage4-cu-evidence
          path: results/stage4/
          if-no-files-found: error
      - name: Stage 5 observer quorum fault matrix
        if: matrix.python-version == '3.12'
        run: |
          python -m hetnet run --duration 18 --subscribers 8 --no-attacks --node-case none --observer-case one_faulty --output results/stage5/single-fault
          python -m hetnet zone-study --duration 18 --subscribers 8 --start-seed 42 --runs 6 --observer-loss-rates 0,0.2,0.45 --output results/stage5/study
      - name: Archive stage 5 observer fault results
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: hetnet-stage5-observer-quorum
          path: results/stage5/
          if-no-files-found: error
