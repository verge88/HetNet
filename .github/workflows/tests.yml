name: Tests
on:
  push:
    branches: [main, feat/unified-signaling-2g-5g]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python -m hetnet run --duration 8 --subscribers 4 --seed 4 --output results
      - name: Ten-seed synthetic research experiment
        if: matrix.python-version == '3.12'
        run: python -m hetnet experiment --duration 18 --subscribers 8 --start-seed 42 --runs 10 --output results/experiment
      - name: Archive reproducible experiment
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: hetnet-stage2-multiseed
          path: results/experiment/
          if-no-files-found: error
      - name: Stage 3 calibrated episode evaluation
        if: matrix.python-version == '3.12'
        run: |
          python -m hetnet calibrate --input examples/synthetic_aggregate_counts.json --output results/stage3/traffic_profile.json
          python -m hetnet validate --duration 18 --subscribers 8 --train-start-seed 21 --train-runs 5 --test-start-seed 42 --test-runs 10 --traffic-profile results/stage3/traffic_profile.json --output results/stage3
          python -m hetnet wirecheck --protocol diameter --hex 010000148000013e010000230000000100000002
      - name: Archive stage 3 validation
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: hetnet-stage3-episode-validation
          path: results/stage3/
          if-no-files-found: error
