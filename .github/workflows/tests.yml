name: Tests
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python -m hetnet run --duration 8 --subscribers 4 --seed 4 --output results
      - name: Ten-seed synthetic research experiment
        if: matrix.python-version == '3.12'
        run: python -m hetnet experiment --duration 18 --subscribers 8 --start-seed 42 --runs 10 --output results/experiment
      - name: Archive reproducible experiment
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: hetnet-stage2-multiseed
          path: results/experiment/
          if-no-files-found: error
      - name: Stage 3 calibrated episode evaluation
        if: matrix.python-version == '3.12'
        run: |
          python -m hetnet calibrate --input examples/synthetic_aggregate_counts.json --output results/stage3/traffic_profile.json
          python -m hetnet validate --duration 18 --subscribers 8 --train-start-seed 21 --train-runs 5 --test-start-seed 42 --test-runs 10 --traffic-profile results/stage3/traffic_profile.json --output results/stage3
          python -m hetnet wirecheck --protocol diameter --hex 010000148000013e010000230000000100000002
          python -m hetnet stress --duration 18 --subscribers 8 --test-runs 3 --scales 1,8,20 --loss-rates 0,0.1 --traffic-profile results/stage3/traffic_profile.json --output results/stage3
      - name: Archive stage 3 validation
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: hetnet-stage3-episode-validation
          path: results/stage3/
          if-no-files-found: error
      - name: Stage 4 independent node evidence benchmark
        if: matrix.python-version == '3.12'
        run: |
          python -m hetnet run --duration 18 --subscribers 8 --no-attacks --node-case report --output results/stage4/report-demo
          python -m hetnet node-study --duration 18 --subscribers 8 --runs 6 --loss-rates 0,0.1,0.35 --output results/stage4/node-study
      - name: Archive stage 4 evidence and measurements
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: hetnet-stage4-cu-evidence
          path: results/stage4/
          if-no-files-found: error
      - name: Stage 5 observer quorum fault matrix
        if: matrix.python-version == '3.12'
        run: |
          python -m hetnet run --duration 18 --subscribers 8 --no-attacks --node-case none --observer-case one_faulty --output results/stage5/single-fault
          python -m hetnet zone-study --duration 18 --subscribers 8 --start-seed 42 --runs 6 --observer-loss-rates 0,0.2,0.45 --output results/stage5/study
      - name: Archive stage 5 observer fault results
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: hetnet-stage5-observer-quorum
          path: results/stage5/
          if-no-files-found: error
      - name: Stage 6 correlated-zone multi-node evaluation
        if: matrix.python-version == '3.12'
        run: |
          python -m hetnet run --duration 18 --subscribers 8 --no-attacks --node-case none --report-fault-nodes msc2,amf5 --shared-zone-case epc_5gc_outage --output results/stage6/demo
          python -m hetnet cohort-study --duration 18 --subscribers 8 --start-seed 42 --runs 6 --fault-cases none,epc_outage,epc_5gc_outage,epc_corrupt,epc_5gc_collude --cohorts none,legacy_5g,epc_ims --shared-zone-probability 1 --output results/stage6/cohorts
      - name: Archive stage 6 correlated domain study
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: hetnet-stage6-multi-node-domains
          path: results/stage6/
          if-no-files-found: error
      - name: Stage 7 probe sampling and verified zonal CU statistics
        if: matrix.python-version == '3.12'
        run: |
          python -m hetnet run --duration 18 --subscribers 8 --no-attacks --node-case none --report-fault-nodes msc2,amf5 --observer-capture-miss 0.05 --quorum-max-count-delta 2 --output results/stage7/probe-demo
          python -m hetnet probe-study --duration 18 --subscribers 8 --start-seed 42 --runs 6 --capture-miss-rates 0,0.05,0.15 --tolerances 0,1,2 --cohorts none,legacy_5g --output results/stage7/probe-study
      - name: Archive stage 7 zonal and observer sampling results
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: hetnet-stage7-zonal-probes
          path: results/stage7/
          if-no-files-found: error
      - name: Stage 8 source-disjoint aggregate counter evaluation
        if: matrix.python-version == '3.12'
        run: |
          python -m hetnet aggregate-audit --input examples/external/lab_training_alpha.json
          python -m hetnet external-eval --train examples/external/lab_training_alpha.json examples/external/lab_training_beta.json --holdout examples/external/lab_holdout_gamma.json --output results/stage8/external
      - name: Archive stage 8 source-disjoint calibration and holdout
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: hetnet-stage8-aggregate-holdout
          path: results/stage8/
          if-no-files-found: error
      - name: Stage 9 synthetic source-disjoint zonal detector comparison
        if: matrix.python-version == '3.12'
        run: |
          python -m hetnet zonal-compare --duration 18 --subscribers 8 --train-start-seed 21 --train-runs 4 --test-start-seed 42 --test-runs 4 --output results/stage9/heldout
      - name: Archive stage 9 zonal detector comparison
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: hetnet-stage9-source-heldout-detectors
          path: results/stage9/
          if-no-files-found: error
      - name: Stage 10 annotated aggregate source and lineage holdout
        if: matrix.python-version == '3.12'
        run: |
          python -m hetnet labeled-audit --input examples/labeled/lab_clean_alpha.json
          python -m hetnet labeled-eval --train examples/labeled/lab_clean_alpha.json examples/labeled/lab_clean_beta.json --holdout examples/labeled/lab_holdout_gamma.json examples/labeled/lab_holdout_delta.json --output results/stage10/labeled
      - name: Archive stage 10 source-heldout aggregate metrics only
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: hetnet-stage10-labeled-aggregate
          path: results/stage10/
          if-no-files-found: error
      - name: Stage 11 unknown-onset temporal episode evaluation
        if: matrix.python-version == '3.12'
        run: |
          python -m hetnet episode-audit --input examples/episodic/episodic_holdout_alpha.json
          python -m hetnet episode-eval --train examples/labeled/lab_clean_alpha.json examples/labeled/lab_clean_beta.json --holdout examples/episodic/episodic_holdout_alpha.json examples/episodic/episodic_holdout_beta.json examples/episodic/episodic_holdout_gamma.json --output results/stage11/episodes
      - name: Archive stage 11 episode metrics only
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: hetnet-stage11-onset-episodes
          path: results/stage11/
          if-no-files-found: error
      - name: Stage 12 ephemeral HMAC self-attestation and clock-bin robustness
        if: matrix.python-version == '3.12'
        run: |
          python -m hetnet attestation-demo --output results/stage12/attestation-demo
          python -m hetnet clock-study --train examples/labeled/lab_clean_alpha.json examples/labeled/lab_clean_beta.json --holdout examples/episodic/episodic_holdout_alpha.json examples/episodic/episodic_holdout_beta.json examples/episodic/episodic_holdout_gamma.json --output results/stage12/clock-study
      - name: Archive stage 12 aggregate-only metrics (never attestation keys)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: hetnet-stage12-attestation-clock
          path: results/stage12/
          if-no-files-found: error
      - name: Stage 13 private durable replay and revoked-key rotation demonstration
        if: matrix.python-version == '3.12'
        run: |
          python -m hetnet durable-replay-demo --output results/stage13/durable-demo
      - name: Archive stage 13 nonsecret state demonstration
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: hetnet-stage13-durable-replay
          path: results/stage13/
          if-no-files-found: error
      - name: Stage 14 local studio HTTP and browser JavaScript checks
        if: matrix.python-version == '3.12'
        run: |
          python -m compileall -q src/hetnet
          python -m unittest discover -s tests -p 'test_research_stage14.py' -v
          python - <<'PY'
          from pathlib import Path
          from hetnet.web_ui import HTML
          source = HTML.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/hetnet-studio.js").write_text(source, encoding="utf-8")
          PY
          node --check /tmp/hetnet-studio.js
